<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CryptoChat</title>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; background: #f5f7fb; color: #111; }
    .wrap { max-width: 920px; margin: 24px auto; padding: 0 16px; }
    .card { background: #fff; border-radius: 12px; padding: 16px; margin-bottom: 16px; box-shadow: 0 2px 8px #0000000f; }
    input, button { padding: 8px 10px; margin: 4px 0; }
    .msg { border-bottom: 1px solid #eee; padding: 8px 0; }
  </style>
</head>
<body>
<div class="wrap" x-data="chatApp()">
  <div class="card">
    <h2>登录 / 注册</h2>
    <input x-model="username" placeholder="用户名" />
    <input x-model="password" placeholder="密码" type="password" />
    <button @click="register">注册</button>
    <button @click="login">登录</button>
    <div x-text="authMessage"></div>
  </div>

  <div class="card">
    <h2>聊天室</h2>
    <input x-model="room" placeholder="房间名" />
    <button @click="connectWs">连接房间</button>
    <div>
      <input x-model="body" placeholder="输入消息" style="width:70%" />
      <button @click="sendMessage">发送</button>
    </div>
    <template x-for="m in messages" :key="m.created_at + m.username + m.body">
      <div class="msg">
        <strong x-text="m.username"></strong>:
        <span x-text="m.body"></span>
      </div>
    </template>
  </div>
</div>

<script>
function chatApp() {
  return {
    api: window.location.origin,
    token: "",
    username: "",
    password: "",
    room: "general",
    body: "",
    authMessage: "",
    messages: [],
    ws: null,
    async register() {
      const r = await fetch(`${this.api}/api/register`, {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({username: this.username, password: this.password}),
      });
      this.authMessage = r.ok ? "注册成功" : "注册失败";
    },
    async login() {
      const r = await fetch(`${this.api}/api/login`, {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({username: this.username, password: this.password}),
      });
      const data = await r.json();
      if (r.ok) {
        this.token = data.token;
        this.authMessage = "登录成功";
        this.loadHistory();
      } else {
        this.authMessage = "登录失败";
      }
    },
    async loadHistory() {
      const r = await fetch(`${this.api}/api/history/${this.room}?limit=100`, {
        headers: {"Authorization": `Bearer ${this.token}`},
      });
      const data = await r.json();
      this.messages = data.messages || [];
    },
    connectWs() {
      if (this.ws) this.ws.close();
      const protocol = window.location.protocol === "https:" ? "wss" : "ws";
      this.ws = new WebSocket(`${protocol}://${window.location.host}/ws/${this.room}`);
      this.ws.onmessage = (ev) => {
        this.messages.push(JSON.parse(ev.data));
      };
      this.loadHistory();
    },
    async sendMessage() {
      if (!this.token) return;
      await fetch(`${this.api}/api/messages`, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Authorization": `Bearer ${this.token}`,
        },
        body: JSON.stringify({room: this.room, username: this.username, body: this.body}),
      });
      this.body = "";
    },
  }
}
</script>
</body>
</html>
